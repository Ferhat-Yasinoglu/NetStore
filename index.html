<!DOCTYPE html>
<!-- lang/dir yalnızca başlangıç değeridir: aşağıdaki i18n betiği, sayfa
     boyanmadan önce bunları kullanıcının seçtiği dile göre günceller. -->
<html lang="tr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070B16" />
  <meta name="description" content="NetStore — stok, satış, müşteri, borç ve tahsilat yönetim paneli" />
  <title>NetStore</title>
  <link rel="stylesheet" href="css/netstore.css" />

  <!-- Telefona kurulabilir uygulama (PWA): ana ekrana eklenince tam ekran açılır. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="NetStore" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="icons/favicon-64.png" />

  <!-- Dil ve tema katmanları gövdeden ÖNCE yüklenir: seçili dil, yazı yönü
       ve renk teması ilk boyama başlamadan uygulansın diye. Aksi halde
       Farsça/Dari kullanıcıda sayfa bir an LTR çizilip sonra RTL'ye,
       aydınlık tema seçende de bir an koyu çizilip sonra beyaza dönüyordu. -->
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script>applyLangToDocument(); applyThemeToDocument();</script>
</head>
<body>

  <!-- Zemin: yavaşça sürüklenen ışık lekeleri + ince ızgara.
       Tamamen süsleme; ekran okuyucudan gizli, tıklamayı geçirir. -->
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob a1"></span>
    <span class="aurora-blob a2"></span>
    <span class="aurora-blob a3"></span>
    <span class="aurora-grid"></span>
  </div>

  <div class="app">

    <!-- ================= Kenar çubuğu ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <img class="brand-mark" src="icons/logo-128.png" alt="" aria-hidden="true" />
        <div style="min-width:0">
          <div class="brand-name" id="brandName">NetStore</div>
          <div class="brand-sub" id="brandSub">Panel</div>
        </div>
        <button class="icon-btn nav-close" id="btnNavClose" data-nav="close">
          <span data-icon="x"></span>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-foot">
        <a class="user-chip" href="#/ayarlar">
          <span class="avatar" id="meAvatar">FY</span>
          <span style="min-width:0">
            <span class="name" id="meName" style="display:block"></span>
            <span class="role" id="meRole"></span>
          </span>
          <span class="chip-caret" data-icon="chevronRight"></span>
        </a>
      </div>
    </aside>

    <!-- ================= Ana alan ================= -->
    <div class="main">

      <header class="topbar">
        <button class="icon-btn hamburger" id="btnBurger" data-nav="open">
          <span data-icon="menu"></span>
        </button>

        <div class="topbar-title">
          <h1 id="pageTitle"></h1>
          <div class="crumb" id="pageCrumb"></div>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn search-toggle" id="btnSearchToggle" data-act="search-toggle">
            <span data-icon="search"></span>
          </button>
          <div class="search">
            <span class="search-lens" data-icon="search"></span>
            <input type="search" id="searchInput" autocomplete="off" />
            <div class="search-panel" id="searchPanel"></div>
          </div>
          <div id="langSwitch"></div>
          <button class="icon-btn theme-btn" id="btnTheme" data-act="toggle-theme">
            <span class="theme-ico ico-sun" data-icon="sun"></span>
            <span class="theme-ico ico-moon" data-icon="moon"></span>
          </button>
          <button class="icon-btn" id="btnNotif">
            <span data-icon="bell"></span>
            <span class="dot"></span>
          </button>
          <button class="icon-btn" id="btnHelp">
            <span data-icon="info"></span>
          </button>
        </div>
        <span class="scroll-bar" id="scrollBar" aria-hidden="true"></span>
      </header>

      <main class="page" id="page"></main>
    </div>

  </div>

  <div class="scrim" data-nav="close" aria-hidden="true"></div>
  <div class="doc-host" id="docHost" role="dialog" aria-modal="true"></div>
  <div class="modal-host" id="modalHost" role="dialog" aria-modal="true"></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <!-- Ortak modda giriş yapılmadan uygulama çizilmez; ekran buraya açılır. -->
  <div class="auth-host" id="authHost" role="dialog" aria-modal="true"></div>

  <!-- js/i18n.js ve js/theme.js <head> içinde yüklendi. -->
  <script src="js/pwa.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/settings.js"></script>

  <!-- Ortak defter: Firebase SDK yerel kopya, ayarlar boşsa yerel modda kalır -->
  <script src="js/firebase-config.js"></script>
  <script src="vendor/firebase.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/auth.js"></script>

  <script src="js/motion.js"></script>
  <script src="js/charts.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="js/seal.js"></script>
  <script src="js/invoice.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

  <script>
    /* Servis çalışanı yalnızca https:// veya localhost üzerinde çalışır;
       dosyadan (file://) açıldığında sessizce atlanır.

       Kendini tazeleme ZORUNLU: önbellek önce servis edildiği için, hatalı
       bir sürüm yayınlandığında telefondaki kopya o sürümde TAKILI KALIYOR.
       Kullanıcının elinde önbelleği temizlemekten başka çıkış yolu olmuyor.
       Bu yüzden yeni servis çalışanı devri aldığında sayfa bir kez
       tazeleniyor; ayrıca uygulama açık kaldığı sürece saatte bir yeni
       sürüm sorgulanıyor. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        /* İlk kurulumda tazelemeye gerek yok: açık olan kabuk zaten ağdan
           yeni geldi. Ama bayrak SABİT tutulamaz — sayfa açıkken ilk kurulum
           tamamlanır, ardından gerçek bir güncelleme gelirse onu da kaçırırdık.
           Bu yüzden devir tesliminde denetleyicinin O ANDAKİ durumuna bakılır
           ve ilk kurulum bir kez işaretlenip geçilir. */
        var ilkKurulumGecildi = !!navigator.serviceWorker.controller;
        var tazelendi = false;

        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (tazelendi) return;
          if (!ilkKurulumGecildi) { ilkKurulumGecildi = true; return; }
          tazelendi = true;

          /* Form ya da belge açıkken tazelemek kullanıcının yazdığını siler;
             o durumda yalnız haber verilir, yeni sürüm sonraki açılışta gelir. */
          var modal = document.getElementById('modalHost');
          var mesgul = document.body.classList.contains('doc-open') ||
            (modal && modal.classList.contains('on'));
          if (mesgul) {
            if (typeof toast === 'function' && typeof t === 'function') toast(t('pw_updated'), 'info');
            return;
          }
          location.reload();
        });

        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(function (reg) {
            if (!reg) return;
            reg.update();
            setInterval(function () { reg.update(); }, 3600000);
          })
          .catch(function () { /* çevrimdışı desteği yok — uygulama yine de çalışır */ });
      });
    }
  </script>
</body>
</html>
